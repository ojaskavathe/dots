# demux frame: transparent chrome around the real tmux.
# no prefix, no status — every key falls through to the inner tmux except
# the binds `demux up` adds (M-s).

set -g status off
set -g prefix None
set -s escape-time 0
set -g mouse on
set -s set-clipboard on
set -g allow-passthrough all
set -g focus-events on
set -g default-terminal tmux-256color
set -as terminal-features '*:RGB'
set -g exit-empty on

# no zombie frames: a detached frame keeps a hidden client attached to the
# real server, which poisons every client-implicit switch-client there
set-hook -g client-detached kill-server

# unobtrusive border between sidebar and the inner client
set -g pane-border-style 'fg=colour236'
set -g pane-active-border-style 'fg=colour236'
