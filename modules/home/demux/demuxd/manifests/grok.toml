# grok CLI detection rules, ported from herdr's manifest (osc_progress
# rules dropped — tmux swallows OSC 9).
id = "grok"
version = "2026.08.21.1"

[[rules]]
id = "osc_title_action_required"
label = "action required"
state = "blocked"
priority = 1300
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "option_dialog"
state = "blocked"
priority = 1200
region = "whole_recent"
visible_blocker = true
line_regex = ['^\s*┃\s+[0-9a-z]+\s+\([●○]\)\s']

[[rules]]
id = "footer_select_hints"
label = "awaiting selection"
state = "blocked"
priority = 1150
region = "bottom_non_empty_lines(4)"
visible_blocker = true
any = [
  { contains = [":select", "ctrl+o:yolo", "ctrl+c:cancel"] },
  { contains = ["tab:scrollback", "shift+x:dismiss"] },
]

[[rules]]
id = "osc_title_working_spinner"
state = "working"
priority = 1100
region = "osc_title"
visible_working = true
regex = ['^[\x{2800}-\x{28FF}] ']

[[rules]]
id = "status_stop_chip"
# splash logo is braille art, so working anchors on the [stop] chip
state = "working"
priority = 900
region = "bottom_non_empty_lines(6)"
visible_working = true
line_regex = ['^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$']

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
regex = ['(^| - )grok$']

[[rules]]
id = "osc_title_other_working"
# any other non-empty title means a turn is in flight
state = "working"
priority = 100
region = "osc_title"
regex = ['\S']
